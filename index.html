<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美股 QDII 限额与大盘情绪监控</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --surface-2: #f3f5f8;
      --border: #e5e8ef;
      --border-strong: #d3d9e4;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #8391a7;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --ok: #15803d;
      --ok-bg: #ecfdf3;
      --warn: #a16207;
      --warn-bg: #fefce8;
      --danger: #be123c;
      --danger-bg: #fff1f2;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 8px 24px -6px rgba(15, 23, 42, 0.08);
      --radius: 14px;
      --radius-sm: 9px;
      --glass: rgba(255, 255, 255, 0.82);
    }

    [data-theme="dark"] {
      --bg: #090b0f;
      --surface: #11141b;
      --surface-2: #181d27;
      --border: #232a37;
      --border-strong: #323c4e;
      --text: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --accent: #60a5fa;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --ok: #4ade80;
      --ok-bg: rgba(34, 197, 94, 0.12);
      --warn: #facc15;
      --warn-bg: rgba(234, 179, 8, 0.12);
      --danger: #fb7185;
      --danger-bg: rgba(244, 63, 94, 0.13);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 30px -8px rgba(0, 0, 0, 0.55);
      --glass: rgba(17, 20, 27, 0.82);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s ease, color 0.2s ease;
      min-height: 100vh;
    }

    svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .hidden { display: none !important; }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pos { color: var(--danger); font-weight: 600; }
    .neg { color: var(--ok); font-weight: 600; }

    /* ===== 登录鉴权页 ===== */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 20% 20%, var(--accent-soft), transparent 42%),
        radial-gradient(circle at 80% 80%, var(--ok-bg), transparent 40%),
        var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 410px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px 28px;
      box-shadow: var(--shadow-md);
      animation: fadeUp 0.28s ease;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
    }
    .brand-icon svg { width: 18px; height: 18px; }
    .auth-brand h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
    .auth-desc { font-size: 13px; color: var(--text-3); margin-bottom: 22px; }

    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface-2);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
      gap: 4px;
    }
    .auth-tab {
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 4px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .auth-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
    .input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      font-size: 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .input:focus { border-color: var(--accent); background: var(--surface); }

    .btn-primary {
      width: 100%;
      height: 42px;
      margin-top: 6px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .auth-msg {
      margin-top: 12px;
      font-size: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      display: none;
    }
    .auth-msg.error { display: block; background: var(--danger-bg); color: var(--danger); }
    .auth-msg.ok { display: block; background: var(--ok-bg); color: var(--ok); }

    /* ===== 主应用顶部导航 ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .nav-pills {
      display: inline-flex;
      background: var(--surface-2);
      padding: 4px;
      border-radius: 11px;
      border: 1px solid var(--border);
      gap: 4px;
    }
    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .nav-pill:hover { color: var(--text); }
    .nav-pill.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .pill-num {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--surface-2);
      color: var(--text-3);
    }
    .nav-pill.active .pill-num { background: var(--accent-soft); color: var(--accent); }

    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 11px;
      border-radius: 9px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-2);
    }

    /* ===== 主内容区 ===== */
    .main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }

    .view-pane { animation: fadeUp 0.22s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 12px;
      color: var(--text-3);
    }

    /* Bento KPI 行 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    @media (max-width: 1024px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 106px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .kpi-card.clickable { cursor: pointer; }
    .kpi-card.clickable:hover { border-color: var(--accent); transform: translateY(-1px); }
    .kpi-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-3); }
    .kpi-val { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .kpi-foot { font-size: 12px; color: var(--text-2); margin-top: 4px; font-variant-numeric: tabular-nums; }

    /* Bento 卡片网格 */
    .bento-two {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 18px;
      margin-bottom: 20px;
    }
    @media (max-width: 920px) { .bento-two { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .card-pad { padding: 20px 22px; }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .card-sub { font-size: 12px; color: var(--text-3); }

    /* 收盘解读 */
    .recap-headline { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
    .recap-body p { font-size: 13.5px; color: var(--text-2); line-height: 1.72; margin-bottom: 10px; }
    .recap-body p:last-child { margin-bottom: 0; }
    .mag7-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .mag7-chip {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }

    /* 红绿灯情绪 */
    .light-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .light-banner.green { background: var(--ok-bg); color: var(--ok); }
    .light-banner.yellow { background: var(--warn-bg); color: var(--warn); }
    .light-banner.red { background: var(--danger-bg); color: var(--danger); }

    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .dot.green { background: var(--ok); }
    .dot.yellow { background: var(--warn); }
    .dot.red { background: var(--danger); }

    .sentiment-list { display: flex; flex-direction: column; }
    .sentiment-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .sentiment-row:last-child { border-bottom: none; padding-bottom: 0; }
    .s-name { font-size: 13px; font-weight: 500; }
    .s-desc { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
    .s-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .s-val { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .s-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); width: 74px; justify-content: flex-end; }

    /* 回撤图表 */
    .chart-box { position: relative; height: 280px; width: 100%; }
    .chart-stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .chart-stats strong { color: var(--text); font-weight: 600; }

    /* 基金列表控制栏 */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .filter-left, .filter-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box svg {
      position: absolute;
      left: 10px;
      color: var(--text-3);
      pointer-events: none;
    }
    .search-input {
      height: 34px;
      width: 210px;
      padding: 0 12px 0 32px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .ctrl-btn, .ctrl-select {
      height: 34px;
      padding: 0 11px;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .ctrl-btn:hover { color: var(--text); border-color: var(--border-strong); }
    .ctrl-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    /* 现代数据表格 */
    .table-wrap { width: 100%; overflow-x: auto; }
    table.fund-table { width: 100%; border-collapse: collapse; min-width: 920px; font-size: 13px; }
    table.fund-table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-3);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      white-space: nowrap;
    }
    table.fund-table td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table.fund-table tbody tr:last-child td { border-bottom: none; }
    table.fund-table tbody tr:hover { background: var(--surface-2); }

    .fund-link {
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .fund-link:hover { color: var(--accent); }
    .sub-line { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; }

    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .tag-ok { background: var(--ok-bg); color: var(--ok); }
    .tag-warn { background: var(--warn-bg); color: var(--warn); }
    .tag-stop { background: var(--danger-bg); color: var(--danger); }

    /* 分页栏 */
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 12.5px;
      color: var(--text-3);
    }
    .page-btns { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .page-btn {
      min-width: 32px;
      height: 32px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-2);
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .footnote {
      margin-top: 22px;
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.75;
      padding: 14px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
    }
  </style>
</head>
<body>

  <!-- ===== 登录 / 注册 / 邀请码视图 ===== -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        </div>
        <h1>美股 QDII 监控台</h1>
      </div>
      <p class="auth-desc">登录后查看纳指、标普每日收盘解读、回撤水位与全市场限额。</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-auth-tab="login" type="button">账号登录</button>
        <button class="auth-tab" data-auth-tab="register" type="button">注册账号</button>
        <button class="auth-tab" data-auth-tab="invite" type="button">邀请码登录</button>
      </div>

      <form id="authForm">
        <div id="userFields">
          <div class="field">
            <label for="authUser">用户名</label>
            <input id="authUser" class="input" type="text" placeholder="请输入 2-20 位用户名" autocomplete="username" />
          </div>
          <div class="field">
            <label for="authPass">密码</label>
            <input id="authPass" class="input" type="password" placeholder="请输入至少 6 位密码" autocomplete="current-password" />
          </div>
        </div>

        <div id="inviteFields" class="hidden">
          <div class="field">
            <label for="authInvite">邀请码</label>
            <input id="authInvite" class="input" type="text" placeholder="请输入有效邀请码" />
          </div>
        </div>

        <button id="authSubmit" class="btn-primary" type="submit">进入监控台</button>
        <div id="authMsg" class="auth-msg"></div>
      </form>
    </div>
  </div>

  <!-- ===== 主应用界面 ===== -->
  <div id="appShell" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-icon" style="width:30px;height:30px;border-radius:8px;">
            <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          </div>
          <span>QDII 监控台</span>
        </div>

        <nav class="nav-pills" aria-label="主导航">
          <button class="nav-pill active" data-page="home" type="button">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
            <span>首页概览</span>
          </button>
          <button class="nav-pill" data-page="nasdaq" type="button">
            <span>纳斯达克基金</span>
            <span id="navNasdaqCount" class="pill-num">0</span>
          </button>
          <button class="nav-pill" data-page="sp500" type="button">
            <span>标普基金</span>
            <span id="navSp500Count" class="pill-num">0</span>
          </button>
        </nav>

        <div class="top-actions">
          <span id="userBadge" class="user-chip">
            <svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span id="userNameText">--</span>
          </span>
          <button id="themeToggle" class="icon-btn" type="button" title="切换深浅色">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
